<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>BORDAXIS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <h1>BORDAXIS</h1>
      <button id="resetBtn" class="ghost danger">最初から</button>
    </header>

    <section class="scoreboard">
      <article id="panelA" class="player-card player-a active">
        <div class="player-label"><span class="dot"></span>PLAYER A</div>
        <div class="score"><span id="scoreA">0.00</span><small> pt²</small></div>
      </article>

      <div class="center-status">
        <div id="roundLabel" class="round">ROUND 1 / 50</div>
      </div>

      <article id="panelB" class="player-card player-b">
        <div class="player-label"><span class="dot"></span>COMPUTER</div>
        <div class="score"><span id="scoreB">0.00</span><small> pt²</small></div>
      </article>
    </section>

    <section class="game-area">
      <div class="board-wrap">
        <canvas id="board" width="760" height="760" aria-label="ゲーム盤"></canvas>
        <div id="winnerOverlay" class="winner-overlay hidden">
          <div class="winner-card">
            <div class="eyebrow">GAME OVER</div>
            <h2 id="winnerTitle">PLAYER A WIN</h2>
            <p id="winnerScore"></p>
            <button id="againBtn" class="primary">もう一度</button>
          </div>
        </div>
      </div>

      <div class="move-buttons">
        <button id="endTurnBtn" class="primary" disabled>ムーブ確定</button>
        <button id="undoBtn" class="ghost" disabled>1手戻す</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
